# Cria a release automaticamente quando você empurra uma tag:
#   git tag v0.2.0 && git push origin v0.2.0
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/release.mjs "${GITHUB_REF_NAME}" "$(git tag -l --format='%(contents:subject)' "${GITHUB_REF_NAME}")"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/agent-office.zip
            dist/version.json
          generate_release_notes: true
